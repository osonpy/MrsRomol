server {
  listen 80;
  client_max_body_size 20m;
  location /rest/v1/ { proxy_pass http://msr-rest:3000/; proxy_set_header Host $host; }
  # Storage: e2e/fake_storage.py running on the host (demo only).
  location /storage/v1/ { proxy_pass http://host.docker.internal:54330; proxy_set_header Host $host; }
}
