server {
  listen 80;
  location /rest/v1/ { proxy_pass http://msr-rest:3000/; proxy_set_header Host $host; }
  # Stand-in for Supabase Storage uploads (demo only): accept and discard.
  location /storage/v1/object/receipts/ { default_type application/json; return 200 '{"Key":"ok"}'; }
  location /storage/v1/object/public/ { alias /storage/; add_header Access-Control-Allow-Origin *; }
}
