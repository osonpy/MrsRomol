[project]
name = "msrromol"
version = "0.1.0"
description = "Misr Romol — Telegram Mini App shop (API + bot)"
requires-python = ">=3.12"
dependencies = [
    # Bot
    "aiogram>=3.7.0",
    "supabase>=2.4.6",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.9.5",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
